{% extends "base.html" %}

{% block title %}Eliminar tour · Quinana Tours{% endblock %}

{% block content %}
  <div class="card card--narrow card--center">
    <h1>Confirmar eliminación</h1>
    <p class="muted">
      ¿Seguro que deseas eliminar permanentemente el tour <strong>«{{ tour.title }}»</strong>?
    </p>

    <form method="post" class="form-actions form-actions--center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'tour_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
