{% extends "crm/base_crm.html" %}

{% block title %}Eliminar destino · CRM Quinana Tours{% endblock %}

{% block content %}
  <div class="card card--narrow card--center">
    <h1>Confirmar eliminación</h1>
    <p class="muted">
      ¿Seguro que deseas eliminar el destino <strong>«{{ destino.name }}»</strong>? Dejará de aparecer en el sitio.
    </p>

    <form method="post" class="form-actions form-actions--center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'destino_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
